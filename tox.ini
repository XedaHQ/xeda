[tox]
# 4.22: the first tox that installs the dependency groups of pyproject.toml.
minversion = 4.22
envlist = py311-compat, py312-compat, py313-compat, py314-compat, py315, mypy, black, ruff
requires =
    tox-gh-actions
isolated_build = True

[gh-actions]
python =
    3.11: py311-compat
    3.12: py312-compat
    3.13: py313-compat
    3.14: py314-compat
    3.15: py315

[testenv]
passenv =
    # Exported by OSS CAD Suite's `environment` script. Its ghdl wrapper sets this itself, but
    # its yosys wrapper does not, and on macOS the yosys GHDL plugin cannot find `std` without it.
    GHDL_PREFIX
    HOME
    PIP_*
    PYTEST_*
    XEDA_TESTS_REQUIRE_TOOLS
    XEDA_TESTS_EXTERNAL
    XEDA_TESTS_EXTERNAL_CACHE
    XEDA_TESTS_EXTERNAL_SLOW
# The groups are in pyproject.toml. The compatibility environments except py311-compat do not run
# the cocotb testbenches of the examples. An environment section inherits this setting: one that
# needs no group sets `dependency_groups =`.
dependency_groups =
    test
    !compat: examples
    py311-compat: examples

commands =
    # One worker per logical CPU (-n auto counts physical cores, and a hosted runner with 4 vCPUs
    # has 2): the tests share nothing (see "Commands" in CLAUDE.md). CI passes `--shard K/N` as
    # {posargs} to run one part of the full suite per job (tests/sharding.py).
    !compat: pytest -n logical --durations=25 {posargs}
    compat: pytest -n logical -m "python_compat and not real_tool" {posargs}
    py311-compat: pytest -n logical tests/test_verilator.py::test_verilator_cocotb_verdict {posargs}

# Compatibility bins need the installed `xeda` command for shell completion, but do not need an
# sdist build. Keep one sdist installation in the full Python 3.15 suite.
package = editable

[testenv:py315]
# Upstream cocotb 2.1.0 supports through Python 3.14 and setup.py rejects Python 3.15 at build
# time unless this variable is set. This lets tox build the optional example dependency from source.
setenv =
    COCOTB_IGNORE_PYTHON_REQUIRES = 1
package = sdist

[testenv:pytest]
minversion = 9
addopts =
    --verbose
    --doctest-modules
testpaths =
    tests/
    # examples/vhdl/sqrt
    # examples
asyncio_mode=auto
dependency_groups =
    test
    examples
commands =
    pytest -s -v
skip_install = false

[testenv:mypy]
testpaths =
    src/
dependency_groups =
deps =
    mypy>=2
commands =
    python -m mypy --install-types --non-interactive src
skip_install = false

[testenv:wheel]
description = build the wheel and run Xeda from a fresh install of it (tools/check_wheel.py)
skip_install = true
dependency_groups =
deps =
    build
commands =
    python tools/check_wheel.py

[testenv:pylint]
testpaths =
    src/
dependency_groups =
deps = pylint
commands =
    pylint --rcfile=pyproject.toml src

[testenv:docs]
description = build the documentation; any Sphinx warning is an error
dependency_groups =
deps =
    -r docs/requirements.txt
commands =
    # -E: no cached environment, so a warning cannot hide behind an earlier build.
    # -W --keep-going: warnings fail the build, after all of them are reported.
    # -n: a reference to something that does not exist is a warning.
    sphinx-build -E -W --keep-going -n -b html docs {envtmpdir}/html

[testenv:black]
dependency_groups =
deps =
    black
commands =
    black --check --diff src tests tools

[testenv:ruff]
dependency_groups =
deps =
    ruff
commands =
    # The repository's broader Ruff rules still have a legacy backlog. Keep the CI target honest
    # and useful by enforcing Pyflakes correctness and PLW0133 (a built-in exception built but
    # never raised) until that backlog is baselined separately. PLW0133 does not see the exception
    # classes xeda defines: tests/test_exceptions_are_raised.py does.
    ruff check --select F,PLW0133 src tests tools

[pycodestyle]
max-line-length = 100
# extend-ignore = D,E203 # D: Docstring errors, E203: see https://github.com/PyCQA/pycodestyle/issues/373
ignore =
    E501
    line-too-long
    missing-module-docstring
    missing-function-docstring
indent-size = 4
exclude =
    .github
    .eggs
    .tox
