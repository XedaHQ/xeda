[tox]
minversion = 4.0
envlist = py{311,312,313,314}, mypy, black, ruff
requires =
    tox-gh-actions
isolated_build = True

[gh-actions]
python =
    3.11: py311, mypy, ruff
    3.12: py312, mypy, black, ruff
    3.13: py313, mypy, black, ruff
    3.14: py314, mypy, black, ruff

[testenv]
passenv =
    # Exported by OSS CAD Suite's `environment` script. Its ghdl wrapper sets this itself, but
    # its yosys wrapper does not, and on macOS the yosys GHDL plugin cannot find `std` without it.
    GHDL_PREFIX
    HOME
    PIP_*
    PYTEST_*
    XEDA_TESTS_REQUIRE_TOOLS
deps =
    pytest>7
    pytest-cov
    jsonschema
    mypy
    pylint
    ruff
    -r examples/requirements.txt
# extras =

commands =
    pytest

[testenv:pytest]
minversion = 7.1
addopts =
    --verbose
    --doctest-modules
testpaths =
    tests/
    # examples/vhdl/sqrt
    # examples
asyncio_mode=auto
deps =
    pytest>7
    pytest-cov
    jsonschema
    -r examples/requirements.txt
commands =
    pytest -s -v
skip_install = false

[testenv:mypy]
testpaths =
    src/
deps =
    mypy>=0.991
commands =
    python -m mypy --install-types --non-interactive src
skip_install = false

[testenv:pylint]
testpaths =
    src/
deps = pylint
commands =
    pylint --rcfile=pyproject.toml src

[testenv:black]
deps =
    black
commands =
    black --check --diff src tests

[testenv:ruff]
deps =
    ruff
commands =
    # The repository's broader Ruff rules still have a legacy backlog. Keep the CI target honest
    # and useful by enforcing Pyflakes correctness until that backlog is baselined separately.
    ruff check --select F src tests

[pycodestyle]
max-line-length = 100
# extend-ignore = D,E203 # D: Docstring errors, E203: see https://github.com/PyCQA/pycodestyle/issues/373
ignore =
    E501
    line-too-long
    missing-module-docstring
    missing-function-docstring
indent-size = 4
exclude =
    .github
    .eggs
    .tox
