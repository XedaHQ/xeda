# gcd_nangate45.yaml: the design `gcd` of OpenROAD-flow-scripts on the platform nangate45, with the
# values of its configuration file (flow/designs/nangate45/gcd/config.mk) as settings. The clock
# period is 0.65 ns. The configuration file asks for 0.25 ns, which these flows do not meet: the
# worst setup slack of the routed design is about 0 at 0.6 ns. TNS_END_PERCENT=100 is the default
# of `tns_end_percent`.
name: gcd
rtl:
  sources: [gcd/gcd.v]
  top: gcd
  clock.port: clk
flows:
  yosys:
    platform: nangate45
    clock.period: 0.65 ns
    # ABC_AREA=1 selects the area script, and the empty ADDER_MAP_FILE leaves the adders to ABC.
    abc.strategy: area
    arithmetic.adder_map: none
  openroad_place:
    platform: nangate45
    clock.period: 0.65 ns
    floorplan.core_utilization_percent: 55
    # PLACE_DENSITY_LB_ADDON=0.20 on top of the density that the cells need.
    global_placement.density.mode: auto
    global_placement.density.headroom: 0.20
    # The grid of grid_strategy-M1-M4-M7.tcl: a smaller pitch for a small block, and no pin layer.
    pdn.grid:
      straps:
        - {layer: metal4, width: 0.48 um, pitch: 28 um, offset: 2 um}
        - {layer: metal7, width: 1.40 um, pitch: 15 um, offset: 2 um}
      pin_layers: []
  openroad_cts:
    platform: nangate45
  openroad_grt:
    platform: nangate45
  openroad:
    platform: nangate45
