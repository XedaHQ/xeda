# One design that writes every key in a shorthand form, and one target that writes the tables
# (see tests/test_targets.py): the shorthand means exactly the table, so the target refines it.
name: shorthands
rtl:
  top: knight
  sources: [knight.v]
  clocks: [CLK]
  parameters:
    - {name: WIDTH, value: 8}
    - {name: DEPTH, value: 2}
tb:
  top: knight_tb
  sources: [knight_tb.v]
  cocotb: true
language:
  vhdl: "08"
flows:
  vivado_synth:
    fpga: {part: xc7a35tcpg236-1}
    nthreads: 2
    clocks: {main_clock: {period: 10 ns}}
targets:
  tables:
    rtl:
      clocks: [{port: CLK, name: sys}]
      parameters: {WIDTH: 4}
    tb:
      cocotb: {module: m}
    language:
      vhdl: {synopsys: true}
    flows:
      vivado_synth:
        fpga: {speed: -2}
        nthreads: 4
        clocks: {main_clock: {freq: 200MHz}}
