# gcd.yaml
# The xeda settings that match flow/designs/nangate45/gcd/config.mk of OpenROAD-flow-scripts.
orfs: nangate45/gcd
clock:
  port: clk
  period: 0.25 ns  # constraint.sdc: set clk_period 0.25
flows:
  yosys:
    abc.strategy: area  # ABC_AREA = 1
    arithmetic.adder_map: none  # ADDER_MAP_FILE :=  (empty: "Adders degrade GCD")
    arithmetic.adder_architecture: kogge_stone  # SYNTH_OPERATIONS_ARGS unset: synth.tcl adds -extra-map lcu_kogge_stone.v
