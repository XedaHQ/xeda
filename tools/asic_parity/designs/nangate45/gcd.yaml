# gcd.yaml
# The xeda settings that match flow/designs/nangate45/gcd/config.mk of OpenROAD-flow-scripts.
orfs: nangate45/gcd
clock:
  port: clk
  period: 0.25 ns  # constraint.sdc: set clk_period 0.25
flows:
  yosys:
    abc.strategy: area  # ABC_AREA = 1
    arithmetic.adder_map: none  # ADDER_MAP_FILE :=  (empty: "Adders degrade GCD")
    arithmetic.adder_architecture: kogge_stone  # SYNTH_OPERATIONS_ARGS unset: synth.tcl adds -extra-map lcu_kogge_stone.v
    # SYNTH_REPEATABLE_BUILD ?= 1 has no effect on the netlist, and the tool lists it as such.
  openroad_place:
    floorplan.core_utilization_percent: 55  # CORE_UTILIZATION = 55
    global_placement.density.mode: auto  # PLACE_DENSITY_LB_ADDON = 0.20
    global_placement.density.headroom: 0.2  # PLACE_DENSITY_LB_ADDON = 0.20
    floorplan.netlist_cleanup.repair.tns_end_percent: 100  # TNS_END_PERCENT = 100
    resize.repair_timing.tns_end_percent: 100  # TNS_END_PERCENT = 100
    # PDN_TCL ?= grid_strategy-M1-M4-M7.tcl of the design: the straps of metal4 and metal7 have
    # half the pitch of the straps of the platform, for a small block, and the grid has no pins.
    pdn.block_pins: false  # PDN_TCL: define_pdn_grid has no -pins
    pdn.grid.rails: [{layer: metal1, width: 0.17 um, pitch: 2.4 um, offset: 0 um}]  # PDN_TCL: the metal1 stripe with -followpins
    pdn.grid.straps: [  # PDN_TCL: add_pdn_stripe on metal4 and on metal7
      {layer: metal4, width: 0.48 um, pitch: 28 um, offset: 2 um},
      {layer: metal7, width: 1.4 um, pitch: 15 um, offset: 2 um}]
  openroad_cts:
    repair.tns_end_percent: 100  # TNS_END_PERCENT = 100
  openroad_grt:
    repair.timing.tns_end_percent: 100  # TNS_END_PERCENT = 100
