[project]
name = "xeda"
description = "Xeda automates simulation, synthesis and implementation with commercial and open-source EDA tools."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
keywords = [
    "EDA",
    "Electronic",
    "Design",
    "Automation",
    "Tool",
    "Synthesis",
    "Simulation",
    "Simulator",
    "Verification",
    "Hardware",
    "Verilog",
    "VHDL",
    "FPGA",
    "ASIC",
]
authors = [ #
    { name = "Kamyar Mohajerani", email = "kammoh@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Utilities",
]
dependencies = [
    "jinja2              ~= 3.1",
    "pydantic            >= 2.14.1, < 3",
    "python-box[]        ~= 7.4.1",
    "attrs               ~= 26.1.0",
    "cattrs              ~= 26.2.1",
    "attrs_strict        ~= 1.0.1",
    "pathvalidate        ~= 3.3.1",
    "click               ~= 8.5.0",
    "click_extra         ~= 9.4",
    "coloredlogs         ~= 15.0",
    "rich                >= 15.0.0",
    "pebble              ~= 5.2.3",
    "pint                >= 0.25.3",
    "importlib_resources >= 7.1.0",                      # backport of importlib.resources, replaces pkg_resources
    "simpleeval          ~= 1.0.8",
    "PyYAML              ~= 6.0",
    # experimental:
    "varname           ~= 1.0.0",
    "overrides         ~= 7.7",
    "simple_term_menu  ~= 1.6",
    "psutil            ~= 7.2.2",
    "pyvcd             ~= 0.5.1",
    "GitPython         >= 3.2.1, < 4",
    "devtools          ~= 0.13",
    "colorama          ~= 0.4",
]

[project.optional-dependencies]

[project.urls]
homepage = "https://github.com/XedaHQ/xeda"
repository = "https://github.com/XedaHQ/xeda.git"
changelog = "https://github.com/XedaHQ/xeda/blob/dev/CHANGELOG.md"
# documentation = "..."

[project.scripts]
xeda = "xeda.cli:cli"

# Dependency groups are not part of the published package: `pip install xeda` installs none of
# them. `uv sync` installs `dev`, which includes the others; the test environments of tox install
# `test` and `examples`.
[dependency-groups]
# What the test suite needs.
test = ["pytest>=9.1.1", "pytest-xdist", "jsonschema"]
# What the cocotb testbenches of the examples need, and pyserial for the host programs of the
# `uart_echo` and `uart_link` examples. The suite runs the testbenches.
examples = [
    "cocotb~=2.1.0",
    "cocotb-coverage~=2.0",
    "setuptools>=84.0",
    "pyserial>=3.5",
    "cocolight @ git+https://github.com/kammoh/cocolight.git",
]
# black >= 26.10.1 is the first release that knows the py314 target set in [tool.black].
dev = [
    { include-group = "test" },
    { include-group = "examples" },
    "mypy",
    "black>=26.10.1",
    "isort",
    "pylint",
    "tox>=4.67.1",
    "ruff>=0.17.1",
]

[tool.uv]
# cocotb 2.1.0 has no wheel for Python 3.15, and the setup.py of its source distribution refuses
# Python 3.15 unless this variable is set. tox sets it in [testenv:py315].
extra-build-variables = { cocotb = { COCOTB_IGNORE_PYTHON_REQUIRES = "1" } }

[build-system]
requires = ["setuptools>=77", "wheel>=0.48.0", "setuptools_scm[toml]>=10.3.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xeda*"]
exclude = [
    "tests/**",
    "*/tests/**",
]
namespaces = false

[tool.setuptools.package-data]
"xeda" = [
    "py.typed",
    "*.cpp",
    "*.md",
    "*.fdc",
    "*.h",
    "*.j2",
    "*.json",
    "*.ldc",
    "*.lpf",
    "*.lef",
    "*.lib",
    "*.mk",
    "*.sh",
    "*.sdc",
    "*.sdf",
    "*.tcl",
    "*.toml",
    "*.ucf",
    "*.xcf",
    "*.xdc",
    "*.ys",
]
# The residue file of each platform, its Yosys techmaps and the attribution of the values in them.
"xeda.platforms" = ["*/platform.yaml", "*/*.v", "NOTICE.md"]
"xeda.flow" = ["templates/*.h"]
"xeda.flows.modelsim" = ["templates/*.tcl"]
"xeda.flows.vivado" = ["templates/*.tcl"]
"xeda.flows.nvc" = ["templates/*.cpp"]
"xeda.flows.openroad" = ["templates/*.j2", "templates/**/*.j2", "data/*"]
"xeda.flows.bsc" = ["templates/*.h", "templates/*.tcl", "templates/*.c"]
"xeda.flows.yosys" = ["templates/*.h", "templates/*.cpp", "data/asic/*"]
# The agent skill's prose lives here; `references/` is not a package, so it is named explicitly.
"xeda.data" = [
    "*.toml",
    "boards/**/*.xdc",
    "boards/**/*.lpf",
    "boards/*/*.md",
]
"xeda.data.agent" = [
    "SKILL.md",
    "references/*.md",
]

[tool.setuptools.exclude-package-data]
"xeda" = [
    "tests/*",
]

[tool.setuptools_scm]

[tool.pytest.ini_options]
# Always report why tests were skipped/xfailed, without enabling verbose per-test output.
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "python_compat: exercises Python and dependency compatibility on every supported Python version",
    "real_tool: marks real-tool regressions that the Python compatibility bin excludes",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]
include = '\.pyi?$'

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "line-too-long",
    "invalid-name",
    "too-few-public-methods",
    "unspecified-encoding",
    "missing-function-docstring",
    "too-many-instance-attributes",
    "too-many-statements",
    "too-many-branches",
    "too-many-locals",
    "too-many-arguments",
    "too-many-nested-blocks",
    # to be removed:
    "missing-module-docstring",
    "unused-argument",
    "fixme",
    "f-string-without-interpolation",
    "wrong-import-order",
    "missing-class-docstring",
    "no-self-argument",               # from pydantic validators (classmethod)
    # "no-self-use",                    # from pydantic validators (classmethod)
]

[tool.pylint.similarities]
min-similarity-lines = 10
# Ignore comments when computing similarities.
ignore-comments = "yes"
# Ignore docstrings when computing similarities.
ignore-docstrings = "yes"
# Ignore imports when computing similarities.
ignore-imports = "no"

[tool.pylint.design]
max-returns = 8

[tool.bandit]
skips = [
    "B701",
    "B101:assert_used",
    "B404:blacklist",   # subprocess module
    "B314",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
# warn_unused_ignores = false
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# for strict mypy:
# disallow_untyped_defs = true
# strict = false
# ignore_missing_imports = true
warn_unused_configs = true
# exclude = ['^build/.*$', '^examples/.*$', '^\.tox/.*$', 'src/flows/openroad/openroad_scripts/utils/.*']
# The merge script runs inside KLayout, which defines its inputs and the module `pya`.
exclude = ['^src/xeda/flows/openroad/data/']
color_output = true
pretty = true
strict_optional = true
# warn_return_any = false
disable_error_code = ["import-untyped", "type-arg", "unused-ignore"]
# A local bound under a condition and read under a copy of it is a traceback the day the two
# disagree: bind it before the condition, or read it where it is bound.
enable_error_code = ["possibly-undefined"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
