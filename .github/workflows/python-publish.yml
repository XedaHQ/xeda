# Build the sdist and the wheel once, check them, and publish those exact files when a release is
# published. Pushes and pull requests only build and check.
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload 📦 to PyPI
on:
  pull_request:
    branches:
      - 'main'
      - 'release/*'
  push:
    branches:
      - 'main'
      - 'release/*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm derives the version from the tags: a shallow clone has none
        fetch-depth: 0
        persist-credentials: false
    - name: Set up 🐍
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine packaging
    - name: Build package
      run: python -m build --outdir dist
    - name: Check the package metadata
      run: twine check --strict dist/*
    - name: Check the built version
      env:
        EVENT_NAME: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'EOF'
        import os
        import pathlib
        from packaging.utils import parse_sdist_filename, parse_wheel_filename
        from packaging.version import Version

        versions = {}
        for path in sorted(pathlib.Path("dist").iterdir()):
            if path.name.endswith(".whl"):
                versions[path.name] = parse_wheel_filename(path.name)[1]
            elif path.name.endswith(".tar.gz"):
                versions[path.name] = parse_sdist_filename(path.name)[1]
            else:
                raise SystemExit(f"unexpected file in dist: {path.name}")
        if len(versions) != 2:
            raise SystemExit(f"expected one sdist and one wheel, found: {sorted(versions)}")
        print(versions)
        if os.environ["EVENT_NAME"] == "release":
            tag = os.environ["TAG"]
            expected = Version(tag.removeprefix("v"))
            wrong = {name: str(v) for name, v in versions.items() if v != expected}
            if wrong:
                raise SystemExit(f"the release tag {tag} does not match the built version: {wrong}")
        EOF
    - name: Upload the package files
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Download the package files
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
