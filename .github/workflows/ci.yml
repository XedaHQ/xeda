name: CI
on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main", "release/*"]
  workflow_dispatch:

# The job only reads: the checkout, and a release lookup the token authenticates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tox:
    env:
      FULL_PYTHON: "3.15"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The full suite (the FULL_PYTHON leg) runs as four parallel jobs, one shard each: a
        # test belongs to exactly one shard (tests/sharding.py). The jobs are "tox (3.15, 1/4)"
        # to "tox (3.15, 4/4)". The other legs have no shard and keep the names "tox (3.11)" ...
        include:
          - python-version: "3.15"
            shard: "1/4"
          - python-version: "3.15"
            shard: "2/4"
          - python-version: "3.15"
            shard: "3/4"
          - python-version: "3.15"
            shard: "4/4"

    # Pinned, not ubuntu-latest: the bsc release tarball installed below is built for
    # ubuntu-24.04, and so is the tcl8.6 package it needs.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # One coherent distribution supplies GHDL, Yosys and the Yosys GHDL plugin. Pin the
      # release so a nightly tool change cannot alter a Python dependency PR underneath us.
      # Authenticating the read-only release lookup avoids the shared-runner API rate limit.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        if: matrix.python-version == '3.11' || matrix.python-version == env.FULL_PYTHON
        with:
          version: "2026-10-08"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nickg/setup-nvc@v1
        if: matrix.python-version == env.FULL_PYTHON
        with:
          version: latest
      # Bluespec Compiler (bsc): the bsc/bsc_sim flows require bsc >= 2026.07.1, installed here
      # from the official release tarball, checked against a pinned sha256, so the version is
      # pinned the same way as the OSS CAD Suite above. The extracted bin/ scripts locate the
      # rest of the install (lib/, bin/core/) relative to their own path, so the real bin/ goes
      # on PATH as-is rather than symlinking the scripts elsewhere. bluetcl and every Bluesim
      # executable link against libtcl8.6, which ubuntu-24.04 does not
      # install by default; a C++ compiler for Bluesim/Verilog-sim links is normally already
      # present on the runner. OSS CAD Suite (above) puts verilator and iverilog on PATH, which
      # is what bsc's `-vsim verilator|iverilog` link step picks up.
      - name: Install Bluespec Compiler (bsc)
        if: matrix.python-version == env.FULL_PYTHON
        env:
          BSC_VERSION: "2026.07.1"
          BSC_SHA256: "4e69030f3a28cb819192a3780e20fd174ff7caf30cacf1cdbf2195cce913a933"
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6 bash zsh fish
          curl -fsSL -o bsc.tar.gz \
            "https://github.com/B-Lang-org/bsc/releases/download/${BSC_VERSION}/bsc-${BSC_VERSION}-ubuntu-24.04.tar.gz"
          echo "${BSC_SHA256}  bsc.tar.gz" | sha256sum -c -
          BSC_DIR="$RUNNER_TOOL_CACHE/bsc/${BSC_VERSION}"
          mkdir -p "$BSC_DIR"
          tar -xzf bsc.tar.gz -C "$BSC_DIR" --strip-components=1
          rm bsc.tar.gz
          echo "$BSC_DIR/bin" >> "$GITHUB_PATH"
          "$BSC_DIR/bin/bsc" -v
      # The full-Python leg installs bash, zsh and fish with bsc above.
      - name: Install shells for completion tests
        if: matrix.python-version != env.FULL_PYTHON
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: ${{ matrix.python-version == env.FULL_PYTHON }}
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: "Run tox targets for ${{ matrix.python-version }}"
        # Python 3.11–3.14 run the marked compatibility set. Python 3.11 also runs a Verilator
        # cocotb smoke. Python 3.15 runs the full tool-backed suite and pinned external bsc tests,
        # one shard of it per job. Every shard installs the same tools, so a skipped test fails
        # (XEDA_TESTS_REQUIRE_TOOLS) in each of them.
        env:
          XEDA_TESTS_REQUIRE_TOOLS: "1"
          XEDA_TESTS_EXTERNAL: ${{ matrix.python-version == env.FULL_PYTHON && '1' || '' }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$SHARD" ]; then
            python -m tox -- --shard "$SHARD"
          else
            python -m tox
          fi

  # The tox job runs on Linux only. This job runs on macOS, with the oldest supported Python,
  # the test files whose code differs by operating system. A call that exists on Linux only, such
  # as os.waitid, fails here. No EDA tool is installed, so a test that needs one skips;
  # XEDA_TESTS_REQUIRE_TOOLS is not set on purpose. The full suite runs on Linux, where the EDA
  # tools are installed.
  # Why each file is here:
  #   process groups, signals and pseudo-terminals: test_proc_utils, test_proc_utils_terminal
  #   file locks (flock): test_read_locks (run-directory leases), test_target_scrub (scrub, which
  #     also handles links), test_generator_staleness (a lock on the design directory),
  #     test_external_cache (six processes fill one cache)
  #   file-system clocks and file metadata: test_digest, test_trace_inputs, test_trace_soundness
  #     (racy timestamps, inode change times)
  #   file copying (fcopyfile): test_utils, test_delivery
  #   links, FIFOs, permissions and resolved paths (a macOS temporary directory is behind a
  #     link): test_trace_directories, test_run_directory, test_run_directory_rule,
  #     test_run_dir_safety, test_run_root, test_isolation
  #   store paths behind links (a macOS temporary directory is behind a link), so that a run
  #     registers and compares the files of a store by their resolved paths: test_locator_settings
  #   store paths behind links, which the PDK providers stat: test_pdk_providers
  #   file locks (flock) of the PDK install lock, and a rename of a directory into the PDK store:
  #     test_pdk_cli, test_lambdapdk_provider
  #   links and resolved paths (a link left at a file that OpenROAD writes; a macOS temporary
  #     directory is behind a link): test_openroad_run_directory, test_fake_openroad
  #   the host's make (GNU make 3.81 on macOS) reading a fragment named by MAKEFILES:
  #     test_verilator_hooks_makefile
  #   interactive shell completion and cursor placement through a pseudo-terminal:
  #     test_cli_settings_completion
  #   Unix socket paths (at most 103 bytes on macOS), a SIGINT that a process ignores, and the end
  #     of a pipe when a process dies: test_remote_ssh
  #   directory locks and their owner processes, a SIGTERM that stops a shell script and its child
  #     (kill, wait, trap), and the macOS userland (sh, tar, df, shasum): test_remote_provision
  #   process groups, signals, file locks (flock) and process trees (psutil): test_remote_agent
  #   a SIGINT handler during a launch, a killed SSH client and the processes of a cancelled
  #     launch on the same machine: test_remote_client
  #   the file locks that `xeda remote clean` finds held, on a fake remote host: test_remote_commands
  #   a launch that keeps the workspace lock and its own session after the agent has exited, and
  #     the processes of a canceled launch: test_remote_detach
  macos:
    # Pinned, not macos-latest, like the Linux jobs: a new image changes the system under the
    # tests when this line does, and not on the day GitHub moves the label.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Full history: xeda's version is derived from the git tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # These files need nothing but pytest and its parallel runner. (jsonschema and the cocotb
      # of the examples are for tests that this job does not run.)
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest pytest-xdist
      - name: Run the operating-system-sensitive tests
        run: >-
          python -m pytest -n logical
          tests/test_proc_utils.py
          tests/test_proc_utils_terminal.py
          tests/test_remote_launch_entry.py
          tests/test_read_locks.py
          tests/test_target_scrub.py
          tests/test_generator_staleness.py
          tests/test_external_cache.py
          tests/test_digest.py
          tests/test_trace_inputs.py
          tests/test_trace_soundness.py
          tests/test_utils.py
          tests/test_delivery.py
          tests/test_trace_directories.py
          tests/test_run_directory.py
          tests/test_run_directory_rule.py
          tests/test_run_dir_safety.py
          tests/test_run_root.py
          tests/test_isolation.py
          tests/test_generated_names.py
          tests/test_locator_settings.py
          tests/test_pdk_providers.py
          tests/test_pdk_cli.py
          tests/test_lambdapdk_provider.py
          tests/test_openroad_run_directory.py
          tests/test_fake_openroad.py
          tests/test_verilator_hooks_makefile.py
          tests/test_cli_settings_completion.py
          tests/test_liberty_shared.py
          tests/test_liberty_freshness.py
          tests/test_remote_ssh.py
          tests/test_remote_manifest.py
          tests/test_remote_provision.py
          tests/test_remote_agent.py
          tests/test_remote_client.py
          tests/test_remote_commands.py
          tests/test_remote_detach.py

  # The documentation must build without a Sphinx warning (tox -e docs: -W, nitpicky), so broken
  # markup or a dead cross-reference fails the pull request. One Python is enough here: it only
  # needs the documentation toolchain, not the EDA tools the full tox target installs. Not in
  # tox-gh-actions' mapping on purpose: the tox job would build it once per Python.
  docs:
    runs-on: ubuntu-24.04
    steps:
      # Full history: xeda's version, which conf.py reads, is derived from the git tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: Build the documentation
        run: "python -m tox -e docs"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install tox
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: Run type and lint checks
        run: "python -m tox -e mypy,black,ruff"
