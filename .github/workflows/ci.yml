name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# The job only reads: the checkout, and a release lookup the token authenticates.
permissions:
  contents: read

jobs:
  tox:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pinned, not ubuntu-latest: the bsc release tarball installed below is built for
    # ubuntu-24.04, and so is the tcl8.6 package it needs.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      # One coherent distribution supplies GHDL, Yosys and the Yosys GHDL plugin. Pin the
      # release so a nightly tool change cannot alter a Python dependency PR underneath us.
      # Authenticating the read-only release lookup avoids the shared-runner API rate limit.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-09-15"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nickg/setup-nvc@v1
        with:
          version: latest
      # Bluespec Compiler (bsc): the bsc/bsc_sim flows require bsc >= 2026.07.1, installed here
      # from the official release tarball, checked against a pinned sha256, so the version is
      # pinned the same way as the OSS CAD Suite above. The extracted bin/ scripts locate the
      # rest of the install (lib/, bin/core/) relative to their own path, so the real bin/ goes
      # on PATH as-is rather than symlinking the scripts elsewhere. bluetcl and every Bluesim
      # executable link against libtcl8.6, which ubuntu-24.04 does not
      # install by default; a C++ compiler for Bluesim/Verilog-sim links is normally already
      # present on the runner. OSS CAD Suite (above) puts verilator and iverilog on PATH, which
      # is what bsc's `-vsim verilator|iverilog` link step picks up.
      - name: Install Bluespec Compiler (bsc)
        env:
          BSC_VERSION: "2026.07.1"
          BSC_SHA256: "4e69030f3a28cb819192a3780e20fd174ff7caf30cacf1cdbf2195cce913a933"
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6 bash zsh fish
          curl -fsSL -o bsc.tar.gz \
            "https://github.com/B-Lang-org/bsc/releases/download/${BSC_VERSION}/bsc-${BSC_VERSION}-ubuntu-24.04.tar.gz"
          echo "${BSC_SHA256}  bsc.tar.gz" | sha256sum -c -
          BSC_DIR="$RUNNER_TOOL_CACHE/bsc/${BSC_VERSION}"
          mkdir -p "$BSC_DIR"
          tar -xzf bsc.tar.gz -C "$BSC_DIR" --strip-components=1
          rm bsc.tar.gz
          echo "$BSC_DIR/bin" >> "$GITHUB_PATH"
          "$BSC_DIR/bin/bsc" -v
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: "Run tox targets for ${{ matrix.python-version }}"
        # CI installs ghdl, yosys (oss-cad-suite), nvc and bsc, so a tool-dependent test that
        # would skip locally must fail here instead of silently passing.
        # XEDA_TESTS_EXTERNAL runs tests/test_bsc_external.py, which clones external Bluespec
        # repositories at pinned commits and takes minutes: the latest Python version runs it,
        # without its slowest test (XEDA_TESTS_EXTERNAL_SLOW, Piccolo's core).
        env:
          XEDA_TESTS_REQUIRE_TOOLS: "1"
          XEDA_TESTS_EXTERNAL: ${{ matrix.python-version == '3.14' && '1' || '' }}
        run: "python -m tox"

  # The documentation must build without a Sphinx warning (tox -e docs: -W, nitpicky), so broken
  # markup or a dead cross-reference fails the pull request. One Python is enough here: it only
  # needs the documentation toolchain, not the EDA tools the job above installs. Not in
  # tox-gh-actions' mapping on purpose: the job above would build it once per Python.
  docs:
    runs-on: ubuntu-24.04
    steps:
      # Full history: xeda's version, which conf.py reads, is derived from the git tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: Build the documentation
        run: "python -m tox -e docs"
