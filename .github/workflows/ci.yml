name: CI
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  tox:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      # One coherent distribution supplies GHDL, Yosys and the Yosys GHDL plugin. Pin the
      # release so a nightly tool change cannot alter a Python dependency PR underneath us.
      # Authenticating the read-only release lookup avoids the shared-runner API rate limit.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-09-15"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nickg/setup-nvc@v1
        with:
          version: latest
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: "Run tox targets for ${{ matrix.python-version }}"
        # CI installs ghdl, yosys (oss-cad-suite) and nvc, so a tool-dependent test that would
        # skip locally must fail here instead of silently passing.
        env:
          XEDA_TESTS_REQUIRE_TOOLS: "1"
        run: "python -m tox"
