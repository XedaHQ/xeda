name: CI
on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main", "release/*"]
  workflow_dispatch:

# The job only reads: the checkout, and a release lookup the token authenticates.
permissions:
  contents: read

jobs:
  tox:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pinned, not ubuntu-latest: the bsc release tarball installed below is built for
    # ubuntu-24.04, and so is the tcl8.6 package it needs.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      # One coherent distribution supplies GHDL, Yosys and the Yosys GHDL plugin. Pin the
      # release so a nightly tool change cannot alter a Python dependency PR underneath us.
      # Authenticating the read-only release lookup avoids the shared-runner API rate limit.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-08"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nickg/setup-nvc@v1
        with:
          version: latest
      # Bluespec Compiler (bsc): the bsc/bsc_sim flows require bsc >= 2026.07.1, installed here
      # from the official release tarball, checked against a pinned sha256, so the version is
      # pinned the same way as the OSS CAD Suite above. The extracted bin/ scripts locate the
      # rest of the install (lib/, bin/core/) relative to their own path, so the real bin/ goes
      # on PATH as-is rather than symlinking the scripts elsewhere. bluetcl and every Bluesim
      # executable link against libtcl8.6, which ubuntu-24.04 does not
      # install by default; a C++ compiler for Bluesim/Verilog-sim links is normally already
      # present on the runner. OSS CAD Suite (above) puts verilator and iverilog on PATH, which
      # is what bsc's `-vsim verilator|iverilog` link step picks up.
      - name: Install Bluespec Compiler (bsc)
        env:
          BSC_VERSION: "2026.07.1"
          BSC_SHA256: "4e69030f3a28cb819192a3780e20fd174ff7caf30cacf1cdbf2195cce913a933"
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6 bash zsh fish
          curl -fsSL -o bsc.tar.gz \
            "https://github.com/B-Lang-org/bsc/releases/download/${BSC_VERSION}/bsc-${BSC_VERSION}-ubuntu-24.04.tar.gz"
          echo "${BSC_SHA256}  bsc.tar.gz" | sha256sum -c -
          BSC_DIR="$RUNNER_TOOL_CACHE/bsc/${BSC_VERSION}"
          mkdir -p "$BSC_DIR"
          tar -xzf bsc.tar.gz -C "$BSC_DIR" --strip-components=1
          rm bsc.tar.gz
          echo "$BSC_DIR/bin" >> "$GITHUB_PATH"
          "$BSC_DIR/bin/bsc" -v
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: "Run tox targets for ${{ matrix.python-version }}"
        # CI installs ghdl, yosys (oss-cad-suite), nvc and bsc, so a tool-dependent test that
        # would skip locally must fail here instead of silently passing.
        # XEDA_TESTS_EXTERNAL runs tests/test_bsc_external.py, which clones external Bluespec
        # repositories at pinned commits and takes minutes: the latest Python version runs it,
        # without its slowest test (XEDA_TESTS_EXTERNAL_SLOW, Piccolo's core).
        env:
          XEDA_TESTS_REQUIRE_TOOLS: "1"
          XEDA_TESTS_EXTERNAL: ${{ matrix.python-version == '3.14' && '1' || '' }}
        run: "python -m tox"

  # The tox job runs on Linux only. This job runs on macOS, with the oldest supported Python,
  # the test files whose code differs by operating system. A call that exists on Linux only, such
  # as os.waitid, fails here. No EDA tool is installed, so a test that needs one skips;
  # XEDA_TESTS_REQUIRE_TOOLS is not set on purpose. The tox job runs the full suite.
  # Why each file is here:
  #   process groups, signals and pseudo-terminals: test_proc_utils, test_remote_streaming
  #   file locks (flock): test_read_locks (run-directory leases), test_target_scrub (scrub, which
  #     also handles links), test_generator_staleness (a lock on the design directory),
  #     test_external_cache (six processes fill one cache)
  #   file-system clocks and file metadata: test_digest, test_trace_inputs, test_trace_soundness
  #     (racy timestamps, inode change times)
  #   file copying (fcopyfile): test_utils, test_delivery
  #   links, FIFOs, permissions and resolved paths (a macOS temporary directory is behind a
  #     link): test_trace_directories, test_run_directory, test_run_dir_safety, test_run_root,
  #     test_isolation
  macos:
    # Pinned, not macos-latest, like the Linux jobs: a new image changes the system under the
    # tests when this line does, and not on the day GitHub moves the label.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Full history: xeda's version is derived from the git tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # These files need nothing but pytest and its parallel runner. (jsonschema and the cocotb
      # of the examples are for tests that this job does not run.)
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest pytest-xdist
      - name: Run the operating-system-sensitive tests
        run: >-
          python -m pytest -n auto
          tests/test_proc_utils.py
          tests/test_remote_streaming.py
          tests/test_read_locks.py
          tests/test_target_scrub.py
          tests/test_generator_staleness.py
          tests/test_external_cache.py
          tests/test_digest.py
          tests/test_trace_inputs.py
          tests/test_trace_soundness.py
          tests/test_utils.py
          tests/test_delivery.py
          tests/test_trace_directories.py
          tests/test_run_directory.py
          tests/test_run_dir_safety.py
          tests/test_run_root.py
          tests/test_isolation.py

  # The documentation must build without a Sphinx warning (tox -e docs: -W, nitpicky), so broken
  # markup or a dead cross-reference fails the pull request. One Python is enough here: it only
  # needs the documentation toolchain, not the EDA tools the tox job installs. Not in
  # tox-gh-actions' mapping on purpose: the tox job would build it once per Python.
  docs:
    runs-on: ubuntu-24.04
    steps:
      # Full history: xeda's version, which conf.py reads, is derived from the git tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions
      - name: Build the documentation
        run: "python -m tox -e docs"
