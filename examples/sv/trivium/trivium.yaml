name: trivium
description: Trivium stream cipher in SystemVerilog, a port of the VHDL example
rtl:
  sources:
    - "trivium.sv"
  top: trivium
  clock.port: clk
  parameters:
    G_IN_BITS: 64
    G_OUT_BITS: 64
# The testbench and the C reference of the VHDL example check this port too.
tb:
  sources:
    - "../../vhdl/Trivium/trivium_tb.py"
    - "../../vhdl/Trivium/cref/trivium64.c"
flows:
  vivado_synth:
    fpga.part: xc7a12tcsg325-3
    clock.freq: 200 MHz
  yosys_fpga:
    fpga.part: xc7a12tcsg325-3
    clock.freq: 200 MHz
