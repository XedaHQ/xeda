description: Running LEDs on the ULX3S board
rtl:
  sources:
    - "blinky.v"
    - {file: "blinky.lpf", type: Lpf}
  top: blinky
  clocks: [{port: clk_25mhz}]
flows:
  openfpgaloader:
    clocks.main_clock.freq: 25 MHz
  nextpnr:
    board: ulx3s_85f
  yosys_fpga:
    fpga.family: ecp5
    clocks.main_clock.freq: 25 MHz
