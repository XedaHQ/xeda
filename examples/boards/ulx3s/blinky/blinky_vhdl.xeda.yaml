description: LED chaser on the ULX3S board, in VHDL
language.vhdl.standard: 2008
rtl:
  sources:
    - "ecp5pll.vhdl"
    - "blinky.vhdl"
    - {file: "blinky-vhdl.lpf", type: Lpf}
  top: blinky
  clocks: [{port: clk_25mhz}]
flows:
  openfpgaloader:
    clocks.main_clock.freq: 25 MHz
  nextpnr:
    board: ulx3s_85f
  yosys_fpga:
    fpga.family: ecp5
    clocks.main_clock.freq: 25 MHz
