design:
  name: 'dvi_test'
  language:
    vhdl:
      standard: 2008
  rtl:
    sources:
      - 'utils_pkg.vhdl'
      - 'vga.vhd'
      - 'vga2dvid.vhd'
      - 'tmds_encoder.vhd'
      - 'ecp5pll.vhdl'
      - 'top_vgatest.vhd'
      - file: 'dvi_test.lpf'
        type: 'Lpf'
    top: 'top_vgatest'
    clock:
      port: 'clk_25mhz'
flows:
  nextpnr:
    board: 'ulx3s_85f'
    clock:
      period: 40 # 25 MHz
    detailed_timing_report: false # nextpnr BUG, o/w crashes
    timing_allow_fail: true
  openfpgaloader:
    board: 'ulx3s_85f'
    clock:
      period: 40 # 25 MHz
