description: LED blinker in SystemVerilog with a C++ testbench
rtl:
  sources:
    - "blink.sv"
  top: blink
  clocks: [{port: clk}]
tb:
  sources:
    - "blink_tb.cpp"
flows:
  yosys_sim:
    cxxrtl.filename: blink.cpp
  yosys_fpga:
    fpga.vendor: xilinx
    fpga.family: xc7
    clocks.main_clock.period: 5 ns
  vivado_synth:
    fpga.part: xc7a100tftg256-2L
    clocks.main_clock.period: 5 ns
