name: trivium
description: Trivium stream cipher
language.vhdl.standard: 2008
rtl:
  sources:
    - "trivium.vhdl"
  top: trivium
  clocks: [{port: clk}]
  parameters:
    G_IN_BITS: 64
    G_OUT_BITS: 64
tb:
  sources:
    - "trivium_tb.py"
    - "cref/trivium64.c"
flows:
  vivado_synth:
    fpga.part: xc7a12tcsg325-3
    clocks.main_clock.freq: 200 MHz
  yosys_fpga:
    fpga.part: xc7a12tcsg325-3
    clocks.main_clock.freq: 200 MHz
