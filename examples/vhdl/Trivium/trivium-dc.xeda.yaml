name: trivium
description: Trivium stream cipher, set up for Design Compiler
language.vhdl.standard: 2008
rtl:
  sources:
    - "trivium.vhdl"
  top: trivium
  clock.port: clk
  parameters:
    G_IN_BITS: 64
    G_OUT_BITS: 64
    G_SETUP_ROUNDS: 4
tb:
  sources:
    - "trivium_tb.py"
    - "cref/trivium64.c"
flows:
  vivado_synth:
    fpga.part: xc7a12tcsg325-3
    clock.freq: 200 MHz
  yosys_fpga:
    fpga.part: xc7a12tcsg325-3
    clock.freq: 200 MHz
  dc:
    target_libraries:
      - "$PWD/lib/SAED90/saed90nm_typ_ht.db"
