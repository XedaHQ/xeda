name: verilog_import
description: >-
  BSV wrapper around an existing Verilog module, imported with `import "BVI"`. The module is a
  two-stage pipelined multiplier with no flow control, and the wrapper makes it latency-insensitive
  with credits. Only a Verilog simulator can simulate it.
rtl:
  # The imported Verilog module is a design source. The Bluespec package that defines `top`
  # comes last among the Bluespec sources.
  sources:
    - "rtl/pipe_mul.v"
    - "rtl/MulUnit.bsv"
  top: mkMulUnit
  clocks: [{port: CLK}]
tb:
  sources:
    - "tb/TbMulUnit.bsv"
  top: mkTbMulUnit
  # Negative test: defining the macro XEDA_INJECT_BUG plants a bug in the design. The testbench
  # must catch it (non-zero exit).
  # defines.XEDA_INJECT_BUG: true
flows:
  bsc_sim:
    # Bluesim, the default simulator of bsc_sim, cannot simulate imported Verilog.
    simulator: verilator
