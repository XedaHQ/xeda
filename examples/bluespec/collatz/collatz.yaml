name: collatz
description: >-
  Collatz sequence unit, written entirely in Bluespec Classic (BH, .bs). It counts the steps to 1
  and the peak value, and flags a 32-bit overflow. The testbench compares 72 sequences with a
  golden model that bsc evaluates at compile time.
rtl:
  sources:
    - "rtl/Collatz.bs"
  top: mkCollatz
  clock.port: CLK
tb:
  # bsc's preprocessor does not read BH sources, so the testbench gets the XEDA_INJECT_BUG
  # macro through a small BSV package. The package that defines `top` comes last.
  sources:
    - "tb/TbCollatzOptions.bsv"
    - "tb/TbCollatz.bs"
  top: mkTbCollatz
  # Negative test: defining the macro XEDA_INJECT_BUG makes the testbench expect a wrong result,
  # so the run must fail (non-zero exit).
  # defines.XEDA_INJECT_BUG: true
