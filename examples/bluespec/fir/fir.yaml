name: fir
description: >-
  Streaming transposed-form FIR filter in BSV. It is polymorphic in its tap count and widths
  (Vector, provisos, numeric types), and the preprocessor macros TAPS and SAMPLE_WIDTH size it.
  The testbench checks every output against a direct-form model.
rtl:
  sources:
    - "rtl/FirFilter.bsv"
  top: mkFirFilter
  clock.port: CLK
  # Preprocessor macros. bsc gets them as `-D TAPS=11 -D SAMPLE_WIDTH=12`. Without them,
  # FirFilter.bsv uses 8 taps and 16-bit samples. Use `defines`, not `parameters`: the generated
  # mkFirFilter has no Verilog parameters for a later flow to set.
  defines.TAPS: 11
  defines.SAMPLE_WIDTH: 12
tb:
  sources:
    - "tb/TbFirFilter.bsv"
  top: mkTbFirFilter
  # Negative test: defining the macro XEDA_INJECT_BUG plants a bug in the design. The testbench
  # must catch it (non-zero exit).
  # defines.XEDA_INJECT_BUG: true
