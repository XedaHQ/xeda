name: ascon
description: >-
  Standalone 32-bit Put/Get Ascon-128/128a and Ascon-Hash v1.2 core with a vector-driven testbench.
rtl:
  sources: []
  top: mkAscon
  clock.port: CLK
  defines.UNROLL_FACTOR: 1
  # Uncomment to select Ascon-128a AEAD. Hash remains Ascon-Hash v1.2.
  # defines.ASCON128A: true
dependencies:
  - "ascon-library.yaml"
tb:
  sources:
    - "tb/AsconVectors.bsv"
    - "tb/TbAscon.bsv"
  top: mkTbAscon
flows:
  bsc_sim:
    # The large vector table needs no C++ optimization; keep simulation builds short.
    cxx_flags: ["-O0"]
  # ASIC place and route on nangate45: `xeda run openroad ascon.yaml`. The shared settings reach the
  # four OpenROAD flows along the chain.
  yosys:
    platform: nangate45
    clock.period: 2.0 ns
  # Vivado synthesis of the module on its own: `xeda run vivado_synth ascon.yaml`.
  vivado_synth:
    fpga.part: xc7a100tcsg324-1
    clock.period: 10 ns
    out_of_context: true
# The FPGA configurations are resource and timing estimates without pins. A board build needs an
# I/O wrapper and constraints.
targets:
  # `xeda run yosys_fpga+nextpnr ascon.yaml --target ecp5`
  ecp5:
    flows:
      yosys_fpga:
        fpga.part: LFE5U-85F-6BG381C
        clock.period: 20 ns
      nextpnr:
        lpf_allow_unconstrained: true
  # `xeda run yosys_fpga ascon.yaml --target artix7`. Synthesis only: nextpnr-himbaechel of openXC7
  # refuses unconstrained I/O, and Xeda refuses a Xilinx nextpnr run without XDC files.
  artix7:
    flows:
      yosys_fpga:
        fpga.part: xc7a100tcsg324-1
        clock.period: 10 ns
