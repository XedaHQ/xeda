name = "crc32"
description = """\
Mixed-language CRC-32 unit: a BSV top (message framing, FIFOs, Server interface) around a BH \
package holding the CRC datapath and a separately synthesized BH engine that folds a 32-bit \
word per cycle. The testbench checks known answers and 62 random messages against a \
table-driven reference."""

[rtl]
# A BH package (.bs) imported by the BSV top; the package defining `top` comes last.
sources = ["rtl/CrcCore.bs", "rtl/CrcUnit.bsv"]
top = "mkCrcUnit"
clock = { port = "CLK" }

[tb]
sources = ["tb/TbCrcUnit.bsv"]
top = "mkTbCrcUnit"
# Negative test: defining the macro XEDA_INJECT_BUG plants a bug in the design, which the
# testbench must catch (non-zero exit):
# defines = { XEDA_INJECT_BUG = true }
